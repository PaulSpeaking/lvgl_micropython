name: Build LVGL MicroPython firmware (Cached ESP-IDF)

on:
  workflow_dispatch:

jobs:
  build-firmware:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ==============================
      # 缓存 ESP-IDF （一次下载，永久使用）
      # ==============================
      - name: Cache ESP-IDF
        uses: actions/cache@v4
        id: esp-idf-cache
        with:
          path: esp-idf
          key: esp-idf-v5.1.4

      # 只有缓存不存在时，才会下载
      - name: Install ESP-IDF (only if cache not found)
        if: steps.esp-idf-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/espressif/esp-idf.git
          cd esp-idf
          git checkout v5.1.4
          git submodule update --init --recursive
          ./install.sh

      # 无论有没有缓存，都必须执行这一步
      - name: Load ESP-IDF environment
        run: |
          cd esp-idf
          source export.sh

      # ==============================
      # 编译固件（官方原版 + 你的引脚）
      # ==============================
      - name: Build ESP32-S3 firmware
        run: |
          python make.py \
            BOARD=ESP32_GENERIC_S3_OCTAL_PSRAM \
            LVGL_ENABLE=1 \
            MICROPY_PY_USSL=1 \
            MICROPY_SSL_MBEDTLS=1 \
            MICROPY_PY_BLUETOOTH=1 \
            MICROPY_PY_NETWORK=1 \
            LVGL_DISPLAY_SPI_DC_PIN=46 \
            LVGL_DISPLAY_SPI_CS_PIN=10 \
            LVGL_DISPLAY_SPI_CLK_PIN=12 \
            LVGL_DISPLAY_SPI_MOSI_PIN=11 \
            LVGL_DISPLAY_SPI_MISO_PIN=13 \
            LVGL_DISPLAY_RST_PIN=0 \
            LVGL_DISPLAY_BL_PIN=45 \
            LVGL_TOUCH_I2C_SDA_PIN=16 \
            LVGL_TOUCH_I2C_SCL_PIN=15 \
            LVGL_TOUCH_RST_PIN=18 \
            LVGL_TOUCH_INT_PIN=17

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3-lvgl
          path: build/firmware.bin
