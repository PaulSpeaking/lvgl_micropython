name: Build LVGL MicroPython firmware (FULL CACHE)

on:
  workflow_dispatch:

jobs:
  build-firmware:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3 python3-pip python3-setuptools python3-serial python3-click python3-cryptography python3-future python3-pyparsing python3-pyelftools cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

      - name: Cache ESP-IDF
        uses: actions/cache@v4
        id: cache-esp-idf
        with:
          path: esp-idf
          key: esp-idf-v5.1.4

      - name: Install ESP-IDF
        if: steps.cache-esp-idf.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/espressif/esp-idf.git
          cd esp-idf
          git checkout v5.1.4
          git submodule update --init --recursive
          ./install.sh

      - name: Build ESP32-S3 firmware
        run: |
          cd esp-idf
          source export.sh
          cd ..
          python make.py esp32 \
            board=ESP32_GENERIC_S3 \
            variant=SPIRAM_OCT \
            flash_size=16 \
            LVGL_ENABLE=1 \
            MICROPY_PY_USSL=1 \
            MICROPY_SSL_MBEDTLS=1 \
            MICROPY_PY_BLUETOOTH=1 \
            MICROPY_PY_NETWORK=1 \
            LVGL_DISPLAY_SPI_DC_PIN=46 \
            LVGL_DISPLAY_SPI_CS_PIN=10 \
            LVGL_DISPLAY_SPI_CLK_PIN=12 \
            LVGL_DISPLAY_SPI_MOSI_PIN=11 \
            LVGL_DISPLAY_SPI_MISO_PIN=13 \
            LVGL_DISPLAY_RST_PIN=0 \
            LVGL_DISPLAY_BL_PIN=45 \
            LVGL_TOUCH_I2C_SDA_PIN=16 \
            LVGL_TOUCH_I2C_SCL_PIN=15 \
            LVGL_TOUCH_RST_PIN=18 \
            LVGL_TOUCH_INT_PIN=17

      # ==============================================
      # 这里 100% 原封不动抄作者官方路径！
      # ==============================================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3-lvgl
          path: build/firmware.bin
