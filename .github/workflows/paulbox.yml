name: Build ESP32‑S3‑N16R8 LVGL IoT Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. 拉取当前仓库
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      # 2. 安装系统依赖（作者原版）
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git wget flex bison gperf python3 python3-pip python3-setuptools cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

      # 3. 安装 ESP‑IDF v5.1.4
      - name: Install ESP‑IDF
        run: |
          git clone -b v5.1.4 --recursive https://github.com/espressif/esp-idf.git ~/esp-idf
          cd ~/esp-idf
          ./install.sh all

      # 4. 编译（适配该仓库 ext_mod 结构，引脚/功能完全不变）
      - name: Build Firmware
        run: |
          source ~/esp-idf/export.sh
          python3 make.py \
            BOARD=ESP32_GENERIC_S3_OCTAL_PSRAM \
            CFLAGS="-DMICROPY_PY_BLUETOOTH=1 \
                    -DMICROPY_PY_NETWORK=1 \
                    -DMICROPY_PY_NETWORK_ESPNOW=1 \
                    -DMICROPY_PY_MQTT=1 \
                    -DLVGL_DISPLAY_SPI_DC_PIN=46 \
                    -DLVGL_DISPLAY_SPI_CS_PIN=10 \
                    -DLVGL_DISPLAY_SPI_CLK_PIN=12 \
                    -DLVGL_DISPLAY_SPI_MOSI_PIN=11 \
                    -DLVGL_DISPLAY_SPI_MISO_PIN=13 \
                    -DLVGL_DISPLAY_RST_PIN=0 \
                    -DLVGL_DISPLAY_BL_PIN=45 \
                    -DLVGL_TOUCH_I2C_SCL_PIN=15 \
                    -DLVGL_TOUCH_I2C_SDA_PIN=16 \
                    -DLVGL_TOUCH_RST_PIN=18 \
                    -DLVGL_TOUCH_INT_PIN=17"

      # 5. 上传固件
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3-full
          path: build/firmware.bin
